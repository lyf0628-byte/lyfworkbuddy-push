<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 行知旅行行程变更协作系统</title>
<style>
:root{--primary:#1a6b52;--primary-dark:#16403a;--bg:#f4f8f3;--border:#cbd4bf;--text:#1f2d27;--muted:#5a6b63}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:36px;width:360px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.card h1{font-size:20px;color:var(--primary-dark);margin-bottom:6px}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:24px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:16px}
button{width:100%;background:var(--primary);color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;cursor:pointer}
button:hover{background:var(--primary-dark)}
.error{color:#b03a2e;font-size:13px;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h1>行知旅行 · 行程变更协作</h1>
  <div class="sub">变更影响与通知闭环 MVP</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>账号</label>
    <input name="username" placeholder="admin / linyizhou" autofocus>
    <label>密码</label>
    <input name="password" type="password" placeholder="admin123 / emp123">
    <button type="submit">登录</button>
  </form>
  <div class="hint">
    演示账号：<br>
    导游 林亦舟 <code>linyizhou</code> / <code>emp123</code><br>
    运营经理 顾明岚 <code>admin</code> / <code>admin123</code>
  </div>
</div>
</body>
</html>
